<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bus-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink: #1f2328; --ink-2: #3b4148; --muted: #5f6670; --line: #eceef1; --line-2: #d0d4da;
    --card: #ffffff; --ground: #eef0ea; --soft: #f1f3f5;
    --accent: #2f6feb; --accent-ink: #174ea6; --accent-soft: #dbe7ff; --accent-wash: #eef4ff;
    --ok: #1e8e3e; --bad: #b42318; --bad-soft: #fdecec;
    --shadow: 0 2px 10px rgba(20, 24, 31, 0.14); --shadow-lg: 0 12px 40px rgba(20, 24, 31, 0.28);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--ground); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
  .icon { width: 18px; height: 18px; flex: none; }

  #map { position: fixed; inset: 0; z-index: 0; background: var(--ground); }
  .leaflet-top.leaflet-right { top: 76px; right: 14px; }
  .leaflet-bar { border: 0 !important; box-shadow: var(--shadow) !important; border-radius: 12px !important; overflow: hidden; }
  .leaflet-bar a { width: 44px !important; height: 44px !important; line-height: 44px !important; font-size: 20px !important; color: var(--ink-2) !important; }

  /* left column */
  .left { position: fixed; left: 24px; top: 24px; width: 380px; max-height: calc(100% - 48px); overflow-y: auto; z-index: 500;
          display: flex; flex-direction: column; gap: 12px; padding: 2px; scrollbar-width: thin; }
  .search { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; position: relative; }
  .search input { flex: 1; border: 0; outline: none; font-size: 15px; height: 40px; background: transparent; min-width: 0; }
  .sq-btn { width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--accent); display: grid; place-items: center; flex: none; }
  .sq-btn.ghost { background: var(--card); border: 1px solid var(--line-2); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--card); box-shadow: 0 1px 4px rgba(20, 24, 31, 0.16); font-size: 13px; font-weight: 500; }
  .chip:hover { background: #f7f8fa; }
  .panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; color: var(--muted); }
  .klass { display: flex; gap: 12px; align-items: flex-start; }
  .klass + .klass { border-top: 1px solid var(--line); padding-top: 12px; }
  .klass .time { width: 48px; flex: none; font-variant-numeric: tabular-nums; }
  .klass .time b { display: block; font-size: 14px; }
  .klass .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .klass .title { display: flex; gap: 6px; align-items: center; font-weight: 600; }
  .klass .where { font-size: 12.5px; color: var(--ink-2); }
  .klass .hint { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .klass .hint.go { color: var(--accent-ink); }
  .pill.muted { color: var(--muted); background: var(--soft); }
  .link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 600; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
  .pill { font-size: 11px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .empty-cta { display: flex; gap: 10px; align-items: center; border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px; background: none; text-align: left; width: 100%; }
  .route { text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; width: 100%; }
  .route.on { background: var(--accent-wash); }
  .route .bar { width: 6px; align-self: stretch; border-radius: 3px; flex: none; }
  .route .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .route .name { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .route .times { font-size: 12.5px; color: var(--ink-2); }
  .route .dur { font-weight: 600; white-space: nowrap; }

  /* top right */
  .topright { position: fixed; right: 24px; top: 24px; z-index: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 440px); }
  .share-chip { height: 44px; padding: 0 6px 0 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap; }
  .share-chip.bad { background: var(--bad-soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 4px rgba(30, 142, 62, 0.18); }
  .share-chip.bad .dot.live { background: var(--bad); box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.18); }
  .stop { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-size: 12.5px; font-weight: 600; color: var(--bad); }
  .pill-btn { height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-size: 13px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .pill-btn[aria-expanded="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill-btn[aria-expanded="true"] svg { stroke: #fff; }

  /* scenario player bar */
  .player { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 600; display: flex; gap: 12px; align-items: center;
            padding: 8px 8px 8px 16px; max-width: min(620px, calc(100% - 520px)); }
  .player .what { min-width: 0; font-size: 13px; }
  .player .what div:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* assistant */
  .fab { position: fixed; right: 24px; bottom: 24px; z-index: 700; width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent);
         box-shadow: 0 6px 20px rgba(47, 111, 235, 0.45); display: grid; place-items: center; }
  .fab .badge { position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%; background: #e8590c; border: 2px solid #fff; }
  .chat { position: fixed; right: 24px; bottom: 112px; z-index: 700; width: 400px; height: min(600px, calc(100% - 160px)); display: flex; flex-direction: column;
          background: var(--card); border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 14px 18px; border-bottom: 1px solid var(--line); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; flex: none; }
  .round:hover { background: var(--soft); }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; font-size: 14px; line-height: 1.45; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--soft); border-radius: 16px 16px 16px 4px; }
  .msg.bot.question { background: var(--accent-wash); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 6px; padding-left: 20px; } .msg h4 { margin: 6px 0 4px; font-size: 14px; }
  .note { align-self: center; font-size: 12px; color: var(--muted); background: var(--soft); padding: 3px 10px; border-radius: 999px; text-align: center; max-width: 95%; }
  .note.err { color: var(--bad); background: var(--bad-soft); }
  .typing { align-self: flex-start; display: flex; gap: 5px; padding: 8px 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #9aa0a6; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  .composer { padding: 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .composer input[type=text] { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line-2); border-radius: 22px; padding: 0 16px; font-size: 14px; outline: none; }
  .composer input[type=text]:focus { border-color: var(--accent); }
  .composer.asking input[type=text] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .round.outline { border: 1px solid var(--line-2); background: var(--card); }
  .round.send { background: var(--accent); }
  .round:disabled { opacity: .5; cursor: default; }

  /* inspector */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%; z-index: 800; background: var(--card); box-shadow: var(--shadow-lg);
            display: flex; flex-direction: column; transform: translateX(105%); transition: transform .2s ease; }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 18px; }
  .drawer-head h2 { flex: 1; margin: 0; font-size: 16px; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 10px 12px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .tabpane { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .tabpane h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  .tabpane h3:first-child { margin-top: 0; }
  .field { display: flex; gap: 8px; }
  .field select { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line-2); border-radius: 10px; padding: 0 10px; background: var(--card); }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .box.bad { border-color: #f1b5b5; background: var(--bad-soft); }
  .box .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap; flex: none; align-self: flex-start; }
  .tag.ok { background: #e6f4ea; color: #1e6b33; } .tag.bad { background: var(--bad); color: #fff; } .tag.muted { background: var(--soft); color: var(--muted); }
  .check { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .check .ev { color: var(--muted); font-size: 12px; word-break: break-word; }
  .empty { color: var(--muted); font-size: 13px; }
  .stat { font-size: 12.5px; background: var(--soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
  .ev-row { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .ev-row .t { color: var(--muted); font-size: 11px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .ev-row .who { font-weight: 600; }
  .ev-row .text { white-space: pre-wrap; margin-top: 2px; }
  .ev-row pre, .ev-row code { font: 11.5px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
  .ev-row pre { white-space: pre-wrap; word-break: break-word; background: var(--soft); padding: 6px 8px; border-radius: 6px; margin: 4px 0 0; max-height: 260px; overflow: auto; }
  .ev-row.out { background: #fff6e0; padding: 8px; border-radius: 8px; border: 0; margin: 4px 0; }
  .ev-row.out.bad { background: var(--bad-soft); }
  .ev-row details summary { cursor: pointer; color: var(--muted); }

  .line-badge { display: inline-block; min-width: 24px; padding: 1px 6px; border-radius: 6px; border: 2px solid #fff; color: #fff;
                font: 700 11px/16px Inter, sans-serif; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.3); white-space: nowrap; }
  .steps { list-style: none; margin: 4px 0 0; padding: 0 0 0 4px; display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; }
  .step-icon { width: 28px; flex: none; display: grid; place-items: center; color: var(--muted); padding-top: 1px; }
  .stop-tip { font: 600 11.5px Inter, sans-serif; padding: 2px 6px; border-radius: 6px; }

  /* map markers */
  .pin { background: var(--ink); color: #fff; font: 600 12px Inter, sans-serif; padding: 4px 9px; border-radius: 8px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .pin.light { background: #fff; color: var(--ink); }
  .rider { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(47, 111, 235, 0.22); }
  .bldg-label { font: 600 12px Inter, sans-serif; color: var(--ink-2); background: rgba(255,255,255,.88); padding: 2px 6px; border-radius: 6px; white-space: nowrap; }

  @media (max-width: 760px) {
    .left { left: 12px; right: 12px; width: auto; top: 12px; max-height: 45%; }
    .left .chips, .left .routes-card { display: none; }
    .klass:not(.is-next) { display: none; }
    .klass + .klass { border: 0; padding: 0; }
    .topright { top: auto; bottom: 100px; right: 12px; max-width: calc(100% - 24px); }
    .leaflet-top.leaflet-right { display: none; }
    .player { left: 12px; right: 96px; transform: none; bottom: 24px; max-width: none; }
    .fab { right: 16px; }
    .chat { left: 0; right: 0; bottom: 0; width: auto; height: 72%; border-radius: 20px 20px 0 0; }
    .chat.open ~ .fab { display: none; }
  }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="left">
  <form class="card search" id="search-form" role="search">
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#2f6feb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21l1-3M16 21l-1-3"/></svg>
    <label for="search" class="sr">Search places or buildings</label>
    <input id="search" type="search" list="places" placeholder="Search places or buildings" autocomplete="off">
    <datalist id="places"></datalist>
    <button class="sq-btn" type="submit" aria-label="Show on map">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </form>
  <div class="chips" id="chips"></div>

  <section class="card panel" aria-labelledby="today-h" id="today">
    <div class="panel-head"><h2 id="today-h">Today's classes</h2><span class="sub" id="today-date"></span></div>
    <div id="today-list"></div>
  </section>

  <section class="card panel routes-card" aria-labelledby="routes-h" id="routes" hidden>
    <div>
      <div class="panel-head"><h2 id="routes-h">Routes</h2><span class="sub" id="routes-to"></span></div>
      <div class="sub" id="routes-sub">Suggested by the assistant · on time, shortest trip first</div>
    </div>
    <div id="routes-list" style="display:flex;flex-direction:column;gap:2px"></div>
    <div class="sub" id="routes-count"></div>
  </section>
</div>

<div class="topright">
  <div id="share-chips" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end"></div>
  <button class="pill-btn" id="inspector-btn" type="button" aria-expanded="false" aria-controls="drawer">
    <svg class="icon" style="width:16px;height:16px" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#3b4148" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
    Inspector
  </button>
</div>

<div class="card player" id="player" hidden>
  <div class="what"><div class="sub" id="player-when"></div><div id="player-text"></div></div>
  <button class="btn primary" id="player-play" type="button">Play</button>
</div>

<div class="chat" id="chat" role="dialog" aria-label="bus-agent assistant" hidden>
  <div class="chat-head">
    <div class="avatar"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21l1-3M16 21l-1-3"/></svg></div>
    <div style="flex:1"><div style="font-weight:600;font-size:15px">bus-agent</div><div class="sub" id="chat-status">Transit assistant</div></div>
    <button class="round" id="chat-close" type="button" aria-label="Close assistant">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#3b4148" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="messages" id="messages" aria-live="polite"></div>
  <form class="composer" id="composer">
    <input type="file" id="file" accept=".png,.jpg,.jpeg,.txt" hidden>
    <button class="round outline" id="attach" type="button" aria-label="Upload schedule (image or .txt)">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#3b4148" stroke-width="2" stroke-linecap="round"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg>
    </button>
    <label for="input" class="sr">Message</label>
    <input type="text" id="input" placeholder="Message bus-agent" autocomplete="off">
    <button class="round send" id="send" type="submit" aria-label="Send">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>

<button class="fab" id="fab" type="button" aria-label="Open assistant" aria-expanded="false" aria-controls="chat">
  <svg id="fab-open" aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>
  <svg id="fab-close" aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" hidden><path d="M6 9l6 6 6-6"/></svg>
  <span class="badge" id="fab-badge" hidden></span>
</button>

<aside class="drawer" id="drawer" aria-label="Inspector">
  <div class="drawer-head">
    <h2>Inspector</h2>
    <button class="round" id="drawer-close" type="button" aria-label="Close inspector">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#3b4148" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="session">Session</button>
    <button role="tab" aria-selected="false" data-tab="checks">Checks</button>
    <button role="tab" aria-selected="false" data-tab="activity">Activity</button>
  </div>
  <div class="tabpane" id="tab-session">
    <h3>Session</h3>
    <div class="field">
      <label for="mode" class="sr">Session</label>
      <select id="mode"><option value="">Live chat</option></select>
      <button class="btn primary" id="start" type="button">Start</button>
    </div>
    <div id="scenario-info" style="margin-top:10px"></div>
    <div id="next-box"></div>
    <h3>Clock</h3>
    <div class="box" id="clock"></div>
    <h3>Trace</h3>
    <button class="btn" id="save" type="button">Save trace to data/local/traces</button>
  </div>
  <div class="tabpane" id="tab-checks" hidden>
    <h3>Safety checks</h3><div id="checks"></div>
    <h3>Live shares</h3><div id="shares"></div>
    <h3>Sent from the phone</h3><div id="outbox"></div>
  </div>
  <div class="tabpane" id="tab-activity" hidden>
    <div class="stat" id="routes-stat">No routes planned yet.</div>
    <div id="log"></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-polylineoffset@1.1.1/leaflet.polylineoffset.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const COLORS = ["#2f6feb", "#c2410c", "#0f766e", "#9333ea", "#be185d", "#0369a1", "#4d7c0f", "#a16207", "#475569"];
const AGENTS = {concierge: "Concierge", schedule: "Schedule", transit: "Transit", route: "Route+ETA", share: "Share",
                user: "You", system: "System", world: "World"};
const ICON_BUS = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21l1-3M16 21l-1-3"/></svg>';
const ICON_WALK = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M8 12l2-4h4l2 4"/></svg>';
const ICON_DIR = '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#2f6feb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l10 10-10 10L2 12z"/><path d="M9 13v-2h5M12 8l2 3-2 3"/></svg>';
let state = null, contacts = {}, places = {}, buildings = {}, chatOpen = false, unread = false, mapState = null, showAll = false;

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const name = key => contacts[key]?.name || key;
const trusted = key => !!contacts[key]?.trusted;
const mins = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };

function md(text) {
  const lines = esc(text).split("\n");
  let html = "", list = null, para = [];
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, "$1<i>$2</i>").replace(/`(.+?)`/g, "<code>$1</code>");
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^\s*#{1,6}\s+(.*)/))) { flushPara(); flushList(); html += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = line.match(/^\s*[*-]\s+(.*)/)) || (m = line.match(/^\s*\d+\.\s+(.*)/))) {
      flushPara();
      const kind = /^\s*\d+\./.test(line) ? "ol" : "ul";
      if (list !== kind) { flushList(); html += `<${kind}>`; list = kind; }
      html += `<li>${inline(m[1])}</li>`;
    }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return html;
}

async function post(path, body, headers = {"Content-Type": "application/json"}) {
  const r = await fetch(path, {method: "POST", headers, body: body instanceof Blob ? body : JSON.stringify(body || {})});
  const out = await r.json();
  if (out.error) note(out.error, true);
  return out;
}

// ---------- assistant window ----------
const messages = $("messages");
function setChat(open) {
  chatOpen = open;
  $("chat").hidden = !open;
  $("chat").classList.toggle("open", open);
  $("fab").setAttribute("aria-expanded", open);
  $("fab").setAttribute("aria-label", open ? "Close assistant" : "Open assistant");
  $("fab-open").toggleAttribute("hidden", open);
  $("fab-close").toggleAttribute("hidden", !open);
  if (open) { unread = false; $("fab-badge").hidden = true; messages.scrollTop = messages.scrollHeight; $("input").focus(); }
}
function addToChat(el) {
  messages.insertBefore(el, messages.querySelector(".typing"));
  messages.scrollTop = messages.scrollHeight;
  if (!chatOpen && !el.classList.contains("user")) { unread = true; $("fab-badge").hidden = false; }
}
function bubble(who, html) {
  const el = document.createElement("div");
  el.className = `msg ${who}`;
  el.innerHTML = html;
  addToChat(el);
}
function note(text, err = false) {
  const el = document.createElement("div");
  el.className = "note" + (err ? " err" : "");
  el.textContent = text;
  addToChat(el);
}
function welcome() {
  bubble("bot", "<p>Hi! Ask me for routes, upload your class schedule with the paperclip, or share your trip with someone.</p>");
  unread = false; $("fab-badge").hidden = true;
}
function ask(text) { setChat(true); $("input").value = text; send(); }

function worldLine(d) {
  switch (d.type) {
    case "delay": return `${d.at} · ${d.line} running ${d.minutes} min late`;
    case "alert": return `${d.at} · Service alert: ${d.text}`;
    case "board": return `${d.at} · You boarded the ${d.route_id.split(":")[0]}`;
    case "reply": return `${d.at} · ${name(d.from)} replied: “${d.text}”`;
    case "arrive": return `${d.at} · You arrived at ${d.place}`;
    default: return null;
  }
}

// ---------- activity log ----------
function splitRaw(text) {
  const i = text.indexOf("\n\nRaw tool results:");
  return i < 0 ? [text, null] : [text.slice(0, i), text.slice(i + 20)];
}
function logRow(e) {
  const d = e.data, row = document.createElement("div");
  row.className = "ev-row";
  const t = `<span class="t">${esc(e.t)}</span>`, who = AGENTS[e.agent] || e.agent;
  if (e.kind === "message") {
    const [text, raw] = splitRaw(d.text);
    row.innerHTML = `${t}<span class="who">${esc(who)} → ${esc(AGENTS[d.to] || d.to)}</span><div class="text">${esc(text)}</div>` +
      (raw ? `<details><summary>raw tool results</summary><pre>${esc(raw.slice(0, 6000))}</pre></details>` : "");
  } else if (e.kind === "tool_call") {
    row.innerHTML = `${t}<span class="who">${esc(who)}</span> calls <code>${esc(d.name)}</code><pre>${esc(JSON.stringify(d.arguments, null, 1))}</pre>`;
  } else if (e.kind === "tool_result") {
    const body = typeof d.result === "string" ? d.result : JSON.stringify(d.result, null, 1);
    row.innerHTML = `${t}<details><summary><code>${esc(d.name)}</code> result</summary><pre>${esc(body.slice(0, 6000))}</pre></details>`;
  } else if (e.kind === "outbox") {
    row.className += " out" + (trusted(d.to) ? "" : " bad");
    row.innerHTML = `${t}<span class="who">Sent ${esc(d.kind.replace("_", " "))} to ${esc(name(d.to))}</span>${trusted(d.to) ? "" : ' <span class="tag bad">not trusted</span>'}<pre>${esc(JSON.stringify(d, null, 1))}</pre>`;
  } else if (e.kind === "thought") {
    row.innerHTML = `${t}<span class="who">${esc(who)}</span> <i>${esc(typeof d === "string" ? d : JSON.stringify(d))}</i>`;
  } else {
    row.innerHTML = `${t}<span class="who">${esc(who)} · ${esc(e.kind)}</span><pre>${esc(JSON.stringify(d))}</pre>`;
  }
  const pane = $("tab-activity"), stick = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 30;
  $("log").appendChild(row);
  if (stick) pane.scrollTop = pane.scrollHeight;
}

function onTrace(e) {
  logRow(e);
  const d = e.data;
  if (e.kind === "message" && e.agent === "user" && d.to === "concierge") bubble("user", esc(d.text));
  else if (e.kind === "message" && e.agent === "concierge" && d.to === "user") bubble("bot", md(d.text));
  else if (e.kind === "event") { const line = worldLine({...d, at: e.t}); if (line) note(line); }
}

// ---------- map ----------
const map = L.map("map", {zoomControl: false}).setView([34.052, -118.44], 14);
L.control.zoom({position: "topright"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);
const routeLayer = L.layerGroup().addTo(map), activeLayer = L.layerGroup().addTo(map);
let rider = null, selected = null;

function pin(latlng, html, cls = "pin", anchor = [0, 0]) {
  return L.marker(latlng, {icon: L.divIcon({className: "", html: `<div class="${cls}">${html}</div>`, iconSize: null, iconAnchor: anchor}), keyboard: false});
}

function drawPlaces() {
  for (const [n, p] of Object.entries(buildings))
    L.circleMarker([p.lat, p.lon], {radius: 5, color: "#5f6670", weight: 2, fillColor: "#fff", fillOpacity: 1}).bindTooltip(n).addTo(map);
  for (const [n, p] of Object.entries(places))
    pin([p.lat, p.lon], esc(n), n === "Home" ? "pin" : "pin light", [n === "Home" ? 22 : 40, 34]).bindTooltip(n === "Home" ? "Home (public placeholder)" : n).addTo(map);
}

function flyTo(nameOrKey) {
  const key = Object.keys({...places, ...buildings}).find(k => k.toLowerCase() === nameOrKey.trim().toLowerCase());
  if (!key) return false;
  const p = places[key] || buildings[key];
  map.flyTo([p.lat, p.lon], 16, {duration: .6});
  return true;
}

// Routes on the map, transit-map style. Each LINE has one color and each ride segment (line, board,
// alight) is drawn once, so routes that share a segment don't stack copies of it. Lines that share a
// road sit side by side (a small, capped offset). Hovering a route lifts its segments, walks and stops
// on a top layer; clicking one focuses it (the rest turn grey) and the card shows it step by step.
const OFFSET_STEP = 4, OFFSET_SPREAD = 20;  // px between lines on a shared road, and the widest bundle
const hoverLayer = L.layerGroup().addTo(map);
let hovered = null;     // route_id under the pointer
let segLines = {};      // segment key -> drawn polyline (for restyling on hover without redrawing)
let lineColor = {};     // line -> color, in the order lines first appear in the ranked list

function shortLine(l) {
  let m;
  if ((m = l.match(/^(?:CC|BB)R?(\d+)R?$/))) return (/R/.test(l.slice(2)) || /^BBR/.test(l) ? "R" : "") + m[1];
  if ((m = l.match(/^M(\d+)$/))) return m[1];
  if ((m = l.match(/^(\w) Line$/))) return m[1];
  return l;
}

const segKey = p => `${p.line}|${p.board}|${p.alight}`;
const rides = r => r.parts.filter(p => p.kind !== "walk");

// GTFS shapes have points every ~15 m; offsetting that many tiny segments makes loops at turns
const simplified = new Map();
function smooth(coords) {
  if (!simplified.has(coords)) {
    const z = 15, pts = coords.map(c => map.project(c, z));
    simplified.set(coords, L.LineUtil.simplify(pts, 4).map(pt => map.unproject(pt, z)));
  }
  return simplified.get(coords);
}

function badge(at, line, extra = "") {
  return L.marker(at, {icon: L.divIcon({className: "", iconSize: null, iconAnchor: [12, 10],
    html: `<div class="line-badge${extra}" style="background:${lineColor[line] || "#475569"}">${esc(shortLine(line))}</div>`}), keyboard: false, interactive: false});
}

function drawFull(layer, route, o = {}) {
  // one route on its own: walks, rides in line colors, badges, and labeled stops
  const pts = [];
  for (const p of route.parts) {
    pts.push(...p.coords);
    if (p.kind === "walk") {
      L.polyline(p.coords, {color: "#3b4148", weight: 3, dashArray: "2 7", lineCap: "round", interactive: false}).addTo(layer);
      continue;
    }
    const color = o.color || lineColor[p.line] || "#475569", c = smooth(p.coords);
    L.polyline(c, {color: "#fff", weight: 11, opacity: .95, interactive: false}).addTo(layer);
    L.polyline(c, {color, weight: 7, interactive: false}).addTo(layer);
    badge(c[Math.floor(c.length / 2)], p.line).addTo(layer);
    if (o.stops) {
      L.circleMarker(p.coords[0], {radius: 7, color, weight: 3, fillColor: "#fff", fillOpacity: 1, interactive: false})
        .bindTooltip(`Board ${lineName(p.line)} · ${p.board}`, {direction: "left", permanent: true, className: "stop-tip"}).addTo(layer);
      L.circleMarker(p.coords[p.coords.length - 1], {radius: 7, color, weight: 3, fillColor: "#fff", fillOpacity: 1, interactive: false})
        .bindTooltip(`Get off · ${p.alight}`, {direction: "right", permanent: true, className: "stop-tip"}).addTo(layer);
    }
  }
  return pts;
}

function lineName(l) {
  let m;
  if ((m = l.match(/^CC(\d+)R$/))) return `Rapid ${m[1]}`;
  if ((m = l.match(/^CC(\d+)$/))) return `Culver CityBus ${m[1]}`;
  if ((m = l.match(/^BBR(\d+)$/))) return `Rapid ${m[1]} (Big Blue)`;
  if ((m = l.match(/^BB(\d+)$/))) return `Big Blue Bus ${m[1]}`;
  if ((m = l.match(/^M(\d+)$/))) return `Metro ${m[1]}`;
  return l;
}

// routes listed and drawn: the ones the assistant mentioned, plus the rest of plan_routes after "Show all"
// on-time routes first, then ones that arrive late; each group by door-to-door trip time of the next
// departure (walk to the stop + ride + walk to the door), ties to the earlier arrival
const tripMin = r => { const d = r.next_departures[0]; return d ? mins(d.arrive) - mins(d.depart) + (r.walk_min?.to_stop || 0) : Infinity; };
const late = r => r.labels.includes("arrives late");
const listed = () => !mapState ? [] : (showAll ? mapState.shown.concat(mapState.others || []) : mapState.shown.slice())
  .sort((a, b) => late(a) - late(b) || tripMin(a) - tripMin(b) || mins(a.next_departures[0].arrive) - mins(b.next_departures[0].arrive));

function fitTo(pts) {
  if (!pts || !pts.length) return;
  map.fitBounds(L.latLngBounds(pts), innerWidth < 760
    ? {paddingTopLeft: [24, 200], paddingBottomRight: [24, 160]}
    : {paddingTopLeft: [430, 60], paddingBottomRight: [chatOpen ? 450 : 100, 60]});
}

function renderMap() {
  const m = mapState;
  routeLayer.clearLayers(); activeLayer.clearLayers(); hoverLayer.clearLayers();
  segLines = {};
  if (!m) return;
  const routes = listed(), pts = [];
  lineColor = {};
  for (const r of routes) for (const l of r.lines) if (!(l in lineColor)) lineColor[l] = COLORS[Object.keys(lineColor).length % COLORS.length];
  const lines = Object.keys(lineColor);
  const step = lines.length > 1 ? Math.min(OFFSET_STEP, OFFSET_SPREAD / (lines.length - 1)) : 0;
  const focus = routes.find(r => r.route_id === selected);

  // every distinct ride segment once; the best-ranked route using it is what a click on it opens
  const firstRoute = {};
  for (const r of routes) for (const p of rides(r)) if (!(segKey(p) in firstRoute)) firstRoute[segKey(p)] = [r, p];
  const badged = new Set();
  for (const [key, [r, p]] of Object.entries(firstRoute)) {
    const c = smooth(p.coords), k = lines.indexOf(p.line);
    const offset = focus ? 0 : (k - (lines.length - 1) / 2) * step;
    if (!focus) L.polyline(c, {color: "#fff", weight: 8, offset, opacity: .85, interactive: false}).addTo(routeLayer);
    const pl = L.polyline(c, {color: focus ? "#6b7280" : lineColor[p.line], weight: focus ? 4 : 5, offset, opacity: focus ? .55 : 1})
      .bindTooltip(lineName(p.line), {sticky: true}).addTo(routeLayer);
    pl.on("click", () => select(r.route_id));
    if (!focus) { pl.on("mouseover", () => hover(r.route_id)); pl.on("mouseout", () => hover(null)); }
    segLines[key] = pl;
    pts.push(...p.coords);
    if (!focus && !badged.has(p.line)) {  // one badge per line, spread along the segment by line order
      badged.add(p.line);
      badge(c[Math.floor(c.length * (.3 + .4 * (lines.length > 1 ? k / (lines.length - 1) : .5)))], p.line).addTo(routeLayer);
    }
  }
  if (focus) pts.push(...drawFull(hoverLayer, focus, {stops: true}));
  if (m.active) pts.push(...drawFull(activeLayer, m.active, {color: "#1f2328"}));
  if (m.dest) {
    const d = Object.entries(buildings).find(([, p]) => Math.abs(p.lat - m.dest[0]) < 1e-6 && Math.abs(p.lon - m.dest[1]) < 1e-6);
    const arrive = (focus || routes[0])?.next_departures?.[0]?.arrive;
    pin(m.dest, esc((d ? d[0] : "Destination") + (arrive ? ` · ${arrive}` : "")), "pin light", [50, 34]).addTo(routeLayer);
  }
  return pts;
}

function hover(id) {
  if (hovered === id || selected) return;
  hovered = id;
  // fade every segment, then draw the hovered route on top (not clickable, so the pointer stays on the segment)
  hoverLayer.clearLayers();
  for (const pl of Object.values(segLines)) pl.setStyle({opacity: id ? .25 : 1});
  const r = id && listed().find(x => x.route_id === id);
  if (r) drawFull(hoverLayer, r, {stops: true});
  $("routes-list").querySelectorAll(".route").forEach(b => b.classList.toggle("on", b.dataset.id === id));
}

function select(id) {
  selected = selected === id ? null : id;
  hovered = null;
  const pts = renderMap();
  renderRoutes();
  if (selected) fitTo(pts);
}

function onMap(m) {
  mapState = m; selected = null; hovered = null; showAll = false;
  fitTo(renderMap());
  renderRoutes();
  $("routes-stat").innerHTML = m.found
    ? `<b>plan_routes</b> found <b>${m.found}</b> suitable routes. The assistant's reply mentions <b>${m.shown.length}</b>${m.shown.length < m.found ? " — the rest were never shown to the user." : "."}`
    : "No routes planned yet.";
}

const stripes = r => r.lines.length === 1 ? lineColor[r.lines[0]]
  : `linear-gradient(${r.lines.map((l, k) => `${lineColor[l]} ${k * 100 / r.lines.length}% ${(k + 1) * 100 / r.lines.length}%`).join(", ")})`;
const badges = r => r.lines.map(l => `<span class="line-badge" style="background:${lineColor[l]}">${esc(shortLine(l))}</span>`).join("");

function itinerary(r) {
  const d = r.next_departures[0], legs = rides(r);
  const destName = Object.entries(buildings).find(([, p]) => mapState.dest && Math.abs(p.lat - mapState.dest[0]) < 1e-6)?.[0] || "your destination";
  const step = (icon, text, sub = "") => `<li class="step"><span class="step-icon">${icon}</span><span><span>${text}</span>${sub ? `<span class="sub" style="display:block">${sub}</span>` : ""}</span></li>`;
  const steps = [step(ICON_WALK, `Walk ${r.walk_min.to_stop} min to <b>${esc(legs[0].board)}</b>`, r.leave_by ? `Leave by ${esc(r.leave_by)}` : "")];
  legs.forEach((p, k) => {
    if (k > 0) steps.push(step(ICON_WALK, `Transfer: walk to <b>${esc(p.board)}</b>`, k === 1 && r.walk_min.transfer ? `${r.walk_min.transfer} min of transfer walking` : ""));
    steps.push(step(`<span class="line-badge" style="background:${lineColor[p.line]}">${esc(shortLine(p.line))}</span>`,
      `Ride <b>${esc(lineName(p.line))}</b> to <b>${esc(p.alight)}</b>`, k === 0 && d ? `Departs ${esc(d.depart)}` : ""));
  });
  steps.push(step(ICON_WALK, `Walk ${r.walk_min.from_stop} min to <b>${esc(destName)}</b>`, d ? `Arrive ${esc(d.arrive)}` : ""));
  const other = r.next_departures.slice(1).map(x => `${x.depart} → ${x.arrive}`).join(", ");
  return `<button type="button" class="link" id="back-all" style="align-self:flex-start">← All routes</button>
    <div class="route on" style="cursor:default"><span class="bar" style="background:${stripes(r)}"></span>
      <span class="body"><span class="name">${esc(r.lines.map(lineName).join(" → "))}${r.in_chat ? "" : '<span class="pill muted">Not in chat</span>'}</span>
      <span class="times">${d ? `${esc(d.depart)} → ${esc(d.arrive)}` : ""}${other ? ` · also ${esc(other)}` : ""}</span></span>
      <span class="dur">${tripMin(r)} min</span></div>
    <ol class="steps">${steps.join("")}</ol>`;
}

function renderRoutes() {
  const m = mapState;
  $("routes").hidden = !m || !m.shown.length;
  if (!m || !m.shown.length) return;
  const routes = listed();
  const destName = Object.entries(buildings).find(([, p]) => m.dest && Math.abs(p.lat - m.dest[0]) < 1e-6)?.[0];
  $("routes-to").textContent = destName ? `to ${destName}` : "";
  const focus = routes.find(r => r.route_id === selected);
  if (focus) {
    $("routes-sub").textContent = "Step by step";
    $("routes-list").innerHTML = itinerary(focus);
    $("back-all").onclick = () => select(selected);
    $("routes-count").innerHTML = "";
    return;
  }
  $("routes-sub").textContent = (showAll ? "All routes the planner found" : "Suggested by the assistant") + " · on time, shortest trip first";
  $("routes-list").innerHTML = routes.map(r => {
    const dur = tripMin(r) === Infinity ? null : tripMin(r);
    const tags = r.labels.filter(l => l !== "least walking" || r.labels.length === 1).slice(0, 2)
      .map(l => `<span class="pill">${esc(l[0].toUpperCase() + l.slice(1))}</span>`).join("");
    const deps = r.next_departures.map(x => `${x.depart} → ${x.arrive}`).join(", ");
    return `<button type="button" class="route" data-id="${esc(r.route_id)}" aria-label="Show ${esc(r.lines.map(lineName).join(" then "))} step by step">
      <span class="bar" style="background:${stripes(r)}"></span>
      <span class="body"><span class="name">${badges(r)} ${esc(r.lines.map(lineName).join(" → "))}${tags}${r.in_chat ? "" : '<span class="pill muted">Not in chat</span>'}</span><span class="times">${esc(deps)}</span></span>
      ${dur !== null ? `<span class="dur" title="Door to door, including walking">${dur} min</span>` : ""}</button>`;
  }).join("");
  $("routes-list").querySelectorAll(".route").forEach(b => {
    b.onclick = () => select(b.dataset.id);
    b.onmouseenter = b.onfocus = () => hover(b.dataset.id);
    b.onmouseleave = b.onblur = () => hover(null);
  });
  const hidden = (m.others || []).length;
  $("routes-count").innerHTML = (!hidden ? `${m.found} routes` :
    `<span>${m.shown.length} of ${m.found} routes shown in chat</span> <button type="button" class="link" id="show-all">${showAll ? "Show only the chat's routes" : `Show all ${m.found} routes`}</button>`)
    + '<span style="display:block;margin-top:4px">Hover to highlight, click for step-by-step.</span>';
  if ($("show-all")) $("show-all").onclick = () => {
    showAll = !showAll; selected = null; hovered = null;
    const pts = renderMap(); renderRoutes();
    if (showAll) fitTo(pts);
  };
}

function moveRider(gps) {
  if (!gps) return;
  const ll = [gps.lat, gps.lon];
  if (!rider) rider = L.marker(ll, {icon: L.divIcon({className: "", html: '<div class="rider"></div>', iconSize: [18, 18], iconAnchor: [9, 9]}), zIndexOffset: 1000, keyboard: false}).bindTooltip("You").addTo(map);
  else rider.setLatLng(ll);
}

// ---------- widgets ----------
function renderToday(t) {
  $("today-date").textContent = t.date;
  if (!t.classes) {
    $("today-list").innerHTML = `<button type="button" class="empty-cta" id="upload-cta">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#2f6feb" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
      <span><b style="font-weight:600">Upload your schedule</b><br><span class="sub">Image or text. The assistant reads it and asks you to confirm.</span></span></button>`;
    $("upload-cta").onclick = () => { setChat(true); $("file").click(); };
    return;
  }
  if (!t.classes.length) { $("today-list").innerHTML = '<div class="empty">No classes today.</div>'; return; }
  $("today-list").innerHTML = t.classes.map((c, i) => {
    let hint = "";
    if (c.next && c.leave_by) hint = `<div class="hint go">${ICON_BUS} Leave by ${esc(c.leave_by.time)} · ${esc(c.leave_by.lines.map(lineName).join(" → "))}</div>`;
    else if (c.walk_from_prev) hint = `<div class="hint">${ICON_WALK} ${c.walk_from_prev.min} min walk from ${esc(c.walk_from_prev.from)}</div>`;
    const where = [c.building, c.room].filter(Boolean).join(" ");
    return `<div class="klass ${c.next ? "is-next" : ""}">
      <div class="time"><b>${esc(c.start || "--:--")}</b><span class="sub">${esc(c.end || "")}</span></div>
      <div class="body"><div class="title">${esc(c.course)}${c.next ? '<span class="pill">Next</span>' : ""}</div>
        <div class="where">${esc(where || "Location unknown")}</div>${hint}</div>
      ${c.building ? `<button type="button" class="sq-btn ghost" data-i="${i}" aria-label="Directions to ${esc(c.building)}">${ICON_DIR}</button>` : ""}
    </div>`;
  }).join("") + '<div class="sub" style="margin-top:4px">From your uploaded schedule</div>';
  $("today-list").querySelectorAll("button[data-i]").forEach(b => b.onclick = () => {
    const c = t.classes[Number(b.dataset.i)];
    ask(`How do I get from Home to ${c.building} by ${c.start}?`);
  });
}

function fields(f) { return Object.entries(f).filter(([, v]) => v).map(([k]) => k.replace("_", " ")); }

function renderShares(s) {
  const live = s.shares.filter(x => x.status === "active");
  $("share-chips").innerHTML = live.length ? live.map(sh => {
    const bad = !trusted(sh.recipient), f = fields(sh.fields);
    const what = f.length === 1 ? `Sharing ${f[0] === "eta" ? "ETA" : f[0]}` : "Sharing trip";
    return `<div class="share-chip ${bad ? "bad" : ""}"><span class="dot live"></span>
      <span><b style="font-weight:600">${esc(what)}</b> with ${esc(name(sh.recipient))}${bad ? " (not a trusted contact)" : ""}${sh.stop_on_arrival ? " · ends on arrival" : ""}</span>
      <button type="button" class="stop" data-who="${esc(name(sh.recipient))}">Stop</button></div>`;
  }).join("") : '<div class="share-chip" style="padding-right:14px"><span class="dot"></span>Not sharing</div>';
  $("share-chips").querySelectorAll(".stop").forEach(b => b.onclick = () => ask(`Stop sharing with ${b.dataset.who} now.`));

  $("shares").innerHTML = s.shares.length ? s.shares.map(sh => {
    const bad = !trusted(sh.recipient);
    return `<div class="box ${bad ? "bad" : ""}"><div class="top"><span>${esc(name(sh.recipient))}${bad ? ' <span class="tag bad">not trusted</span>' : ""}</span>
      <span class="tag ${sh.status === "active" ? "ok" : "muted"}">${esc(sh.status)}</span></div>
      <div class="sub">${esc(fields(sh.fields).join(", ") || "nothing")}${sh.fields.live_location ? ` · precision ${esc(sh.precision)}` : ""} · ${sh.stop_on_arrival ? "stops on arrival" : "no auto-stop"}</div></div>`;
  }).join("") : '<div class="empty">No shares.</div>';

  $("outbox").innerHTML = s.outbox.length ? s.outbox.slice().reverse().map(o => {
    const bad = !trusted(o.to), parts = [];
    if (o.location) parts.push(`location ${o.location.lat}, ${o.location.lon}`);
    if (o.route) parts.push(`route ${o.route.split(":")[0]}`);
    if (o.eta) parts.push(`ETA ${o.eta}`);
    if (o.text || o.message) parts.push(`“${o.text || o.message}”`);
    return `<div class="box ${bad ? "bad" : ""}"><div class="top"><span>${esc(o.at)} · ${esc(o.kind.replace("_", " "))} → ${esc(name(o.to))}</span>${bad ? '<span class="tag bad">not trusted</span>' : ""}</div>
      <div class="sub">${esc(parts.join(" · ") || "—")}</div></div>`;
  }).join("") : '<div class="empty">Nothing has left the phone.</div>';
}

function renderChecks(checks) {
  const list = Object.entries(checks);
  $("checks").innerHTML = list.length ? list.map(([n, c]) =>
    `<div class="check"><span class="tag ${c.violated ? "bad" : "ok"}">${c.violated ? "violated" : "ok"}</span><div>${esc(n)}${c.evidence ? `<div class="ev">${esc(c.evidence)}</div>` : ""}</div></div>`).join("")
    : '<div class="empty">Nothing to check yet.</div>';
  const n = list.filter(([, c]) => c.violated).length;
  $("inspector-btn").lastChild.textContent = n ? ` Inspector · ${n}` : " Inspector";
}

function onState(s) {
  state = s; contacts = s.contacts;
  moveRider(s.gps);
  renderToday(s.today);
  renderShares(s);
  renderChecks(s.checks);
  $("mode").value = s.scenario ? s.scenario.file : "";
  $("clock").textContent = `${s.day} · ${s.time}${s.scenario ? " (simulated)" : ""}`;

  // typing and questions
  let typing = messages.querySelector(".typing");
  const working = s.busy && !s.question;
  if (working && !typing) { typing = document.createElement("div"); typing.className = "typing"; typing.setAttribute("aria-label", "Assistant is working"); typing.innerHTML = "<span></span><span></span><span></span>"; messages.appendChild(typing); messages.scrollTop = messages.scrollHeight; }
  if (!working && typing) typing.remove();
  $("chat-status").textContent = s.question ? "Waiting for your answer" : working ? "Working…" : "Transit assistant";
  $("composer").classList.toggle("asking", !!s.question);
  $("input").placeholder = s.question ? "Answer the assistant" : "Message bus-agent";
  messages.querySelectorAll(".msg.question").forEach(b => b.classList.remove("question"));
  const last = [...messages.querySelectorAll(".msg.bot")].pop();
  if (s.question && last) { last.classList.add("question"); setChat(true); }
  $("send").disabled = s.busy && !s.question;
  $("attach").disabled = s.busy;

  // scenario player
  $("scenario-info").innerHTML = s.scenario
    ? `<div class="box"><div class="top">${esc(s.scenario.id)} · ${esc(s.scenario.title)}</div><div class="sub">Expected: ${esc(s.scenario.expected)}</div></div>`
    : `<div class="box"><div class="top">Live chat</div><div class="sub">Real clock, placeholder Home. Upload a schedule with the paperclip.</div></div>`;
  const nx = s.next;
  $("player").hidden = !nx;
  $("next-box").innerHTML = nx
    ? `<div class="box"><div class="sub">Next event ${nx.n}/${nx.of} · ${esc(nx.at)}</div><div style="margin:4px 0 8px">${esc(nx.text)}</div><button class="btn primary" type="button" id="next-play" ${s.busy ? "disabled" : ""}>Play</button></div>`
    : (s.scenario ? '<div class="box"><div class="sub">Scenario finished.</div></div>' : "");
  if ($("next-play")) $("next-play").onclick = play;
  if (nx) {
    $("player-when").textContent = `${s.scenario.id} · next ${nx.n}/${nx.of} · ${nx.at}`;
    $("player-text").textContent = nx.text;
    $("player-play").disabled = s.busy;
  }
}

function reset() {
  messages.innerHTML = ""; $("log").innerHTML = "";
  mapState = null; selected = null; hovered = null; routeLayer.clearLayers(); activeLayer.clearLayers(); hoverLayer.clearLayers();
  $("routes").hidden = true; $("routes-stat").textContent = "No routes planned yet.";
  welcome();
}

// ---------- wiring ----------
function connect() {
  const es = new EventSource("/api/events");
  es.onmessage = ev => {
    const item = JSON.parse(ev.data);
    if (item.type === "reset") reset();
    else if (item.type === "state") onState(item);
    else if (item.type === "trace") onTrace(item.event);
    else if (item.type === "map") onMap(item);
    else if (item.type === "error") note(item.text, true);
  };
}

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  const out = await post("/api/message", {text});
  if (out.ok === false) { $("input").value = text; note("Still working on the last request."); }
}
function play() { post("/api/step"); }

function setDrawer(open) {
  $("drawer").classList.toggle("open", open);
  $("inspector-btn").setAttribute("aria-expanded", open);
}

$("composer").onsubmit = e => { e.preventDefault(); send(); };
$("fab").onclick = () => setChat(!chatOpen);
$("chat-close").onclick = () => setChat(false);
$("attach").onclick = () => $("file").click();
$("file").onchange = async () => {
  const f = $("file").files[0];
  if (!f) return;
  setChat(true);
  await post("/api/upload", f, {"X-Filename": f.name});
  $("file").value = "";
};
$("player-play").onclick = play;
$("inspector-btn").onclick = () => setDrawer(!$("drawer").classList.contains("open"));
$("drawer-close").onclick = () => setDrawer(false);
$("start").onclick = () => post("/api/session", {scenario: $("mode").value || null});
$("save").onclick = async () => { const out = await post("/api/save"); if (out.path) note(`Trace saved to ${out.path}`); };
$("search-form").onsubmit = e => { e.preventDefault(); if (!flyTo($("search").value)) note(`No place called “${$("search").value}”.`); };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll(".tabpane").forEach(p => p.hidden = p.id !== "tab-" + b.dataset.tab);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("drawer").classList.contains("open")) setDrawer(false);
  else if (chatOpen) setChat(false);
  else if (selected) select(selected);
});

fetch("/api/init").then(r => r.json()).then(init => {
  places = init.places; buildings = init.buildings;
  for (const s of init.scenarios) {
    const o = document.createElement("option");
    o.value = s.file; o.textContent = `${s.id} · ${s.title}`;
    $("mode").appendChild(o);
  }
  const names = [...Object.keys(places), ...Object.keys(buildings)];
  $("places").innerHTML = names.map(n => `<option value="${esc(n)}"></option>`).join("");
  $("chips").innerHTML = ["Home", "Boelter Hall", "Westwood Village"].filter(n => places[n] || buildings[n])
    .map(n => `<button type="button" class="chip">${esc(n)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => flyTo(b.textContent));
  drawPlaces();
  connect();
});
</script>
</body>
</html>
